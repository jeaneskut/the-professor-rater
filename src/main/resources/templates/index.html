<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate CS Teaching Staff</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body>
    <header>
        <h1>Rate CS Teaching Staff</h1>
        <p>Student reviews for better learning.</p>
        <a th:href="@{/ratings/new}" class="add-button">Add a Rating</a>
    </header>

    <main id="mainpart">
        <h2>Teaching Staff</h2>

        <!-- Search and filters -->
        <fieldset>
            <legend>Find teaching staff</legend>

            <label for="search">Name:</label>
            <input type="text" id="search" placeholder="Search by name">

            <label for="role">Role:</label>
            <select id="role">
                <option value="ALL">All roles</option>
                <option value="PROF">Professor</option>
                <option value="TA">Teaching Assistant</option>
                <option value="INSTRUCTOR">Instructor</option>
                <option value="STAFF">Staff</option>
            </select>

            <label for="sort">Sort:</label>
            <select id="sort">
                <option value="name">Name (A-Z)</option>
                <option value="high">Highest score</option>
                <option value="low">Lowest score</option>
            </select>
        </fieldset>

        <p id="results">Showing all staff members.</p>

        <!-- Staff cards are added by JavaScript -->
        <div id="staff-list">
            <article class="staff-card" th:each="rating : ${ratings}">
                <h3 th:text="${rating.name}">Staff Name</h3>

                <p class="role"
                th:text="${rating.roleType}">
                    Professor
                </p>

                <p>
                    Overall Score:
                    <strong
                        th:text="${#numbers.formatDecimal((rating.clarity + rating.niceness + rating.knowledgeableScore) / 3.0, 1, 1)}">
                        9.0
                    </strong>/10
                </p>

                <a class="details-button"
                th:href="@{/ratings/{id}(id=${rating.id})}">
                    View Details
                </a>
            </article>
        </div>

        <p th:if="${#lists.isEmpty(ratings)}" id="empty-database">
            No staff ratings have been added yet.
        </p>

        <p id="message" hidden>
            No staff members found.
        </p>
    </main>

    <footer>
        <p>Rate CS Teaching Staff &copy; 2026</p>
    </footer>
</body>
</html>
