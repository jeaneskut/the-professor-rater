<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Details - Rate CS</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>Staff Details</h1>
        <a href="/" class="add-button">Back to Staff List</a>
    </header>

    <main id="mainpart">
        <div class="staff-card">
            <h2 id="staff-name">John Doe</h2>
            <p id="staff-role" class="role">Professor</p>
            <p>Email: <span id="staff-email">jdoe@sfu.ca</span></p>

            <hr>

            <h3>Rating Scores</h3>

            <p>Clarity: <strong id="clarity">9/10</strong></p>
            <p>Niceness: <strong id="niceness">8/10</strong></p>
            <p>Knowledge: <strong id="knowledge">10/10</strong></p>

            <p>Overall Score:</p>
            <p id="overall-score" class="score">9.0/10</p>

            <hr>

            <h3>Student Comment</h3>
            <p id="comment">This class lowkey light lmao.</p>

            <a href="/edit.html" class="details-button">Edit Rating</a>
            <a class="details-button">Delete Rating</a>
            

            <p id="delete-message" hidden></p>
        </div>
    </main>

    <footer>
        <p>Rate CS Teaching Staff &copy; 2026</p>
    </footer>
</body>
</html>
