<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Rating - Rate CS</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>Edit Staff Rating</h1>
        <a href="/" class="add-button">Back to Staff List</a>
    </header>

    <main id="mainpart">
        <form id="rating-form" novalidate>
            <fieldset>
                <legend>Staff Information</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                       value="Alex Morgan" maxlength="100" required>
                <p class="field-error" id="name-error" hidden></p>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       value="alex@example.edu" maxlength="254" required>
                <p class="field-error" id="email-error" hidden></p>

                <label for="roleType">Role:</label>
                <select id="roleType" name="roleType" required>
                    <option value="TA">Teaching Assistant</option>
                    <option value="PROF" selected>Professor</option>
                    <option value="INSTRUCTOR">Instructor</option>
                    <option value="STAFF">Staff</option>
                </select>
                <p class="field-error" id="role-error" hidden></p>
            </fieldset>

            <fieldset>
                <legend>Rating Scores</legend>

                <label for="clarity">Clarity (1–10):</label>
                <input type="number" id="clarity" name="clarity"
                       value="9" min="1" max="10" step="1" required>
                <p class="field-error" id="clarity-error" hidden></p>

                <label for="niceness">Niceness (1–10):</label>
                <input type="number" id="niceness" name="niceness"
                       value="8" min="1" max="10" step="1" required>
                <p class="field-error" id="niceness-error" hidden></p>

                <label for="knowledge">Knowledge (1–10):</label>
                <input type="number" id="knowledge" name="knowledge"
                       value="10" min="1" max="10" step="1" required>
                <p class="field-error" id="knowledge-error" hidden></p>

                <label for="comment">Comment (optional):</label>
                <textarea id="comment" name="comment"
                          maxlength="1000" rows="4">Explains difficult concepts clearly and is very helpful.</textarea>
                <p class="field-error" id="comment-error" hidden></p>
            </fieldset>

            <button type="submit" class="details-button">
                Save Changes
            </button>

            <p id="form-message" hidden></p>
        </form>
    </main>

    <footer>
        <p>Rate CS Teaching Staff &copy; 2026</p>
    </footer>
</body>
</html>
